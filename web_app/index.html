<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Schedule Tracker</title>
  <style>
    :root {
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-light: #eef2ff;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --success: #10b981;
      --cat-work: #2563eb;
      --cat-study: #7c3aed;
      --cat-fitness: #059669;
      --cat-personal: #d97706;
      --cat-meeting: #dc2626;
      --cat-other: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      min-height: 100vh;
      padding-bottom: 90px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--bg);
      min-height: 100vh;
      position: relative;
    }

    /* Top Header */
    .header {
      background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
      color: white;
      padding: 24px 20px 28px 20px;
      border-bottom-left-radius: 24px;
      border-bottom-right-radius: 24px;
      box-shadow: 0 4px 12px rgba(79, 70, 229, 0.15);
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 24px;
      font-weight: 700;
    }

    .header .subtitle {
      font-size: 13px;
      color: #c7d2fe;
      margin-top: 4px;
    }

    /* Happening Now Banner */
    .happening-card {
      background: white;
      margin: -16px 16px 16px 16px;
      padding: 16px;
      border-radius: 16px;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.06);
      border: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .happening-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--success);
      letter-spacing: 0.5px;
    }

    .happening-title {
      font-size: 17px;
      font-weight: 700;
      color: var(--text-main);
    }

    .happening-sub {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Day Selector Tabs */
    .days-scroll {
      display: flex;
      overflow-x: auto;
      gap: 8px;
      padding: 12px 16px;
      scrollbar-width: none;
    }
    .days-scroll::-webkit-scrollbar { display: none; }

    .day-btn {
      flex: 0 0 auto;
      padding: 8px 16px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: white;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
      box-shadow: 0 2px 8px rgba(79, 70, 229, 0.25);
    }

    /* Progress Bar */
    .progress-section {
      padding: 8px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: var(--text-muted);
    }

    .progress-bar-bg {
      width: 120px;
      height: 8px;
      background: #e2e8f0;
      border-radius: 999px;
      overflow: hidden;
    }

    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Schedule List */
    .schedule-list {
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .schedule-card {
      background: white;
      border-radius: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      display: flex;
      overflow: hidden;
      transition: transform 0.15s ease;
    }

    .card-color-bar {
      width: 6px;
      flex-shrink: 0;
    }

    .card-content {
      padding: 14px;
      flex-grow: 1;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .time-badge {
      font-size: 12px;
      font-weight: 700;
      color: var(--primary);
    }

    .badges {
      display: flex;
      gap: 6px;
      align-items: center;
    }

    .cat-badge {
      font-size: 10px;
      font-weight: 700;
      color: white;
      padding: 2px 8px;
      border-radius: 6px;
    }

    .priority-badge {
      font-size: 10px;
      color: var(--text-muted);
      background: #f1f5f9;
      padding: 2px 6px;
      border-radius: 4px;
    }

    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 4px;
    }

    .card-title.completed {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .card-notes {
      font-size: 12px;
      color: var(--text-muted);
    }

    .card-actions {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }

    .check-btn {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 2px solid var(--border);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
    }

    .check-btn.checked {
      background: var(--primary);
      border-color: var(--primary);
      color: white;
    }

    .del-btn {
      background: none;
      border: none;
      color: #94a3b8;
      cursor: pointer;
      font-size: 14px;
      padding: 4px;
    }
    .del-btn:hover { color: #ef4444; }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 48px 20px;
      color: var(--text-muted);
    }
    .empty-state span { font-size: 40px; display: block; margin-bottom: 8px; }

    /* Floating Add Button */
    .fab {
      position: fixed;
      bottom: 24px;
      right: calc(50% - 220px);
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 999px;
      padding: 14px 22px;
      font-weight: 700;
      font-size: 14px;
      box-shadow: 0 4px 16px rgba(79, 70, 229, 0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 10;
    }

    @media (max-width: 480px) {
      .fab { right: 20px; }
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      align-items: flex-end;
      justify-content: center;
      z-index: 100;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      animation: slideUp 0.25s ease-out;
    }

    @keyframes slideUp {
      from { transform: translateY(100%); }
      to { transform: translateY(0); }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .form-group label {
      font-size: 12px;
      font-weight: 700;
      color: var(--text-muted);
    }

    .form-control {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 14px;
      outline: none;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      margin-top: 8px;
    }

    .btn {
      flex: 1;
      padding: 12px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      border: none;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-secondary { background: #f1f5f9; color: var(--text-muted); }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <div class="header">
      <div class="header-top">
        <div>
          <h1>Schedule Tracker</h1>
          <div class="subtitle" id="currentDateText">Today • Mon, Sep 13</div>
        </div>
      </div>
    </div>

    <!-- Happening Now Card -->
    <div class="happening-card" id="happeningCard">
      <div class="happening-header">
        <span id="happeningStatus">● HAPPENING NOW</span>
        <span id="happeningTime">09:30 - 10:00</span>
      </div>
      <div class="happening-title" id="happeningTitle">Team Standup & Sync</div>
      <div class="happening-sub" id="happeningCategory">Work • Priority: High</div>
    </div>

    <!-- Day Filter Buttons -->
    <div class="days-scroll" id="daysScroll"></div>

    <!-- Progress Indicator -->
    <div class="progress-section">
      <span id="progressLabel">0 of 0 completed (0%)</span>
      <div class="progress-bar-bg">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- Schedule Item List -->
    <div class="schedule-list" id="scheduleList"></div>

    <!-- Empty State -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <span>📅</span>
      <h3>No events scheduled</h3>
      <p>Tap "+ Add Event" to schedule your day</p>
    </div>

    <!-- Floating Action Button -->
    <button class="fab" id="fabAdd">＋ Add Event</button>
  </div>

  <!-- Add/Edit Modal -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card">
      <h2 style="font-size: 18px;" id="modalTitle">New Schedule Event</h2>
      
      <div class="form-group">
        <label>Event Title</label>
        <input type="text" id="inputTitle" class="form-control" placeholder="e.g. Algorithms Lecture, Gym Session" />
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Day</label>
          <select id="inputDay" class="form-control"></select>
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="inputCategory" class="form-control">
            <option value="Work">Work</option>
            <option value="Study">Study</option>
            <option value="Fitness">Fitness</option>
            <option value="Personal">Personal</option>
            <option value="Meeting">Meeting</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Start Time</label>
          <input type="time" id="inputStartTime" class="form-control" value="09:00" />
        </div>
        <div class="form-group">
          <label>End Time</label>
          <input type="time" id="inputEndTime" class="form-control" value="10:00" />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Priority</label>
          <select id="inputPriority" class="form-control">
            <option value="Low">Low</option>
            <option value="Medium" selected>Medium</option>
            <option value="High">High</option>
          </select>
        </div>
        <div class="form-group">
          <label>Notes / Link</label>
          <input type="text" id="inputNotes" class="form-control" placeholder="Optional details" />
        </div>
      </div>

      <div class="modal-actions">
        <button class="btn btn-secondary" id="btnCancel">Cancel</button>
        <button class="btn btn-primary" id="btnSave">Save Event</button>
      </div>
    </div>
  </div>

  <script>
    const DAYS = ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday", "Sunday"];
    const CAT_COLORS = {
      Work: "#2563eb",
      Study: "#7c3aed",
      Fitness: "#059669",
      Personal: "#d97706",
      Meeting: "#dc2626",
      Other: "#475569"
    };

    const DEFAULT_SCHEDULES = [
      { id: 1, title: "Morning Workout", day: "Monday", startTime: "07:00", endTime: "08:00", category: "Fitness", priority: "High", notes: "Cardio & Stretching", completed: true },
      { id: 2, title: "Team Standup & Sync", day: "Monday", startTime: "09:30", endTime: "10:00", category: "Work", priority: "High", notes: "Weekly sprint goals", completed: false },
      { id: 3, title: "Deep Study Block", day: "Monday", startTime: "11:00", endTime: "13:00", category: "Study", priority: "Medium", notes: "System Design & Architecture", completed: false },
      { id: 4, title: "Feature Coding", day: "Monday", startTime: "14:30", endTime: "17:00", category: "Work", priority: "High", notes: "API integration", completed: false },
      { id: 5, title: "Evening Reading", day: "Monday", startTime: "20:00", endTime: "21:00", category: "Personal", priority: "Low", notes: "Read 20 pages", completed: false },

      { id: 6, title: "Algorithms & Code Practice", day: "Tuesday", startTime: "09:00", endTime: "11:00", category: "Study", priority: "High", notes: "Data structures practice", completed: false },
      { id: 7, title: "Project Sync", day: "Tuesday", startTime: "14:00", endTime: "15:00", category: "Meeting", priority: "Medium", notes: "Client milestone review", completed: false },
      { id: 8, title: "Strength Training", day: "Tuesday", startTime: "18:00", endTime: "19:30", category: "Fitness", priority: "Medium", notes: "Upper body session", completed: false },

      { id: 9, title: "Architecture Review", day: "Wednesday", startTime: "10:00", endTime: "12:00", category: "Work", priority: "High", notes: "Tech spec walkthrough", completed: false },
      { id: 10, title: "Study Review", day: "Wednesday", startTime: "15:00", endTime: "17:00", category: "Study", priority: "Medium", notes: "Review notes", completed: false },

      { id: 11, title: "Sprint Retro & Planning", day: "Friday", startTime: "16:00", endTime: "17:00", category: "Work", priority: "Medium", notes: "Team review", completed: false },
      { id: 12, title: "Weekend 5K Run", day: "Saturday", startTime: "08:00", endTime: "09:00", category: "Fitness", priority: "Medium", notes: "Outdoor park run", completed: false }
    ];

    let schedules = JSON.parse(localStorage.getItem("schedule_tracker_data") || "null");
    if (!schedules) {
      schedules = DEFAULT_SCHEDULES;
      localStorage.setItem("schedule_tracker_data", JSON.stringify(schedules));
    }

    const todayDate = new Date();
    const currentDayIndex = (todayDate.getDay() + 6) % 7;
    let selectedDay = DAYS[currentDayIndex];
    let editingId = null;

    function init() {
      renderDaysTabs();
      renderCurrentDate();
      renderSchedules();
      setupEventListeners();
    }

    function renderCurrentDate() {
      const opts = { weekday: 'short', month: 'short', day: 'numeric' };
      document.getElementById("currentDateText").textContent = `Today • ${todayDate.toLocaleDateString('en-US', opts)}`;
    }

    function renderDaysTabs() {
      const container = document.getElementById("daysScroll");
      const daySelect = document.getElementById("inputDay");
      container.innerHTML = "";
      daySelect.innerHTML = "";

      DAYS.forEach(day => {
        const btn = document.createElement("button");
        btn.className = `day-btn ${day === selectedDay ? "active" : ""}`;
        btn.textContent = day.substring(0, 3);
        btn.onclick = () => {
          selectedDay = day;
          renderDaysTabs();
          renderSchedules();
        };
        container.appendChild(btn);

        const opt = document.createElement("option");
        opt.value = day;
        opt.textContent = day;
        daySelect.appendChild(opt);
      });
    }

    function renderSchedules() {
      const listContainer = document.getElementById("scheduleList");
      const emptyState = document.getElementById("emptyState");
      const dayItems = schedules.filter(s => s.day === selectedDay).sort((a, b) => a.startTime.localeCompare(b.startTime));

      listContainer.innerHTML = "";

      if (dayItems.length === 0) {
        emptyState.style.display = "block";
      } else {
        emptyState.style.display = "none";
        dayItems.forEach(item => {
          const card = document.createElement("div");
          card.className = "schedule-card";
          const catColor = CAT_COLORS[item.category] || "#475569";

          card.innerHTML = `
            <div class="card-color-bar" style="background: ${catColor};"></div>
            <div class="card-content">
              <div class="card-top">
                <span class="time-badge">${item.startTime} - ${item.endTime}</span>
                <div class="badges">
                  <span class="cat-badge" style="background: ${catColor};">${item.category}</span>
                  <span class="priority-badge">${item.priority}</span>
                </div>
              </div>
              <div class="card-title ${item.completed ? 'completed' : ''}">${escapeHtml(item.title)}</div>
              ${item.notes ? `<div class="card-notes">${escapeHtml(item.notes)}</div>` : ''}
            </div>
            <div class="card-actions">
              <button class="check-btn ${item.completed ? 'checked' : ''}" onclick="toggleComplete(${item.id})">
                ${item.completed ? '✓' : ''}
              </button>
              <button class="del-btn" onclick="deleteItem(${item.id})" title="Delete">✕</button>
            </div>
          `;
          listContainer.appendChild(card);
        });
      }

      updateProgress(dayItems);
      updateHappeningNow(dayItems);
    }

    function updateProgress(dayItems) {
      const completed = dayItems.filter(i => i.completed).length;
      const total = dayItems.length;
      const pct = total === 0 ? 0 : Math.round((completed / total) * 100);

      document.getElementById("progressLabel").textContent = `${completed} of ${total} completed (${pct}%)`;
      document.getElementById("progressBar").style.width = `${pct}%`;
    }

    function updateHappeningNow(dayItems) {
      const now = new Date();
      const currentHHMM = String(now.getHours()).padStart(2, '0') + ":" + String(now.getMinutes()).padStart(2, '0');
      const active = dayItems.find(i => currentHHMM >= i.startTime && currentHHMM <= i.endTime);

      const banner = document.getElementById("happeningCard");
      if (active) {
        banner.style.display = "flex";
        document.getElementById("happeningStatus").textContent = "● HAPPENING NOW";
        document.getElementById("happeningStatus").style.color = "var(--success)";
        document.getElementById("happeningTime").textContent = `${active.startTime} - ${active.endTime}`;
        document.getElementById("happeningTitle").textContent = active.title;
        document.getElementById("happeningCategory").textContent = `${active.category} • Priority: ${active.priority}`;
      } else {
        const next = dayItems.find(i => i.startTime > currentHHMM);
        if (next) {
          banner.style.display = "flex";
          document.getElementById("happeningStatus").textContent = "NEXT UP";
          document.getElementById("happeningStatus").style.color = "var(--primary)";
          document.getElementById("happeningTime").textContent = `Starts at ${next.startTime}`;
          document.getElementById("happeningTitle").textContent = next.title;
          document.getElementById("happeningCategory").textContent = `${next.category} • Priority: ${next.priority}`;
        } else {
          banner.style.display = "none";
        }
      }
    }

    function toggleComplete(id) {
      const item = schedules.find(s => s.id === id);
      if (item) {
        item.completed = !item.completed;
        saveSchedules();
        renderSchedules();
      }
    }

    function deleteItem(id) {
      if (confirm("Delete this event?")) {
        schedules = schedules.filter(s => s.id !== id);
        saveSchedules();
        renderSchedules();
      }
    }

    function saveSchedules() {
      localStorage.setItem("schedule_tracker_data", JSON.stringify(schedules));
    }

    function setupEventListeners() {
      const modal = document.getElementById("modalOverlay");
      const fab = document.getElementById("fabAdd");
      const btnCancel = document.getElementById("btnCancel");
      const btnSave = document.getElementById("btnSave");

      fab.onclick = () => {
        editingId = null;
        document.getElementById("modalTitle").textContent = "New Schedule Event";
        document.getElementById("inputTitle").value = "";
        document.getElementById("inputDay").value = selectedDay;
        document.getElementById("inputNotes").value = "";
        modal.classList.add("active");
      };

      btnCancel.onclick = () => modal.classList.remove("active");

      btnSave.onclick = () => {
        const title = document.getElementById("inputTitle").value.trim();
        if (!title) {
          alert("Please enter a title");
          return;
        }

        const day = document.getElementById("inputDay").value;
        const category = document.getElementById("inputCategory").value;
        const startTime = document.getElementById("inputStartTime").value || "09:00";
        const endTime = document.getElementById("inputEndTime").value || "10:00";
        const priority = document.getElementById("inputPriority").value;
        const notes = document.getElementById("inputNotes").value.trim();

        schedules.push({
          id: Date.now(),
          title,
          day,
          category,
          startTime,
          endTime,
          priority,
          notes,
          completed: false
        });

        saveSchedules();
        modal.classList.remove("active");
        selectedDay = day;
        renderDaysTabs();
        renderSchedules();
      };
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    init();
  </script>
</body>
</html>
